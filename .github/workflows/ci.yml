name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[agent,trace,serve,dev]"
      - name: Lint
        run: ruff check src tests
      # The CC BY guideline corpus is not committed; one test checks the retrieval
      # labels against it.
      - name: Fetch guideline corpus
        run: python scripts/fetch_guidelines.py
      # No API key, dataset or weights here: the tests use small synthetic data and
      # fake clients. The evals that call Claude are run by hand (RESULTS.md).
      - name: Test
        run: pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Web UI (type-check and build)
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t surgidoc .
      # No weights, index or API key in CI: the app starts without them (models load on
      # the first run), so this checks the image installs and serves.
      - name: Start and check /health
        run: |
          docker run -d --name api -p 8000:8000 surgidoc
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health; then
              curl -sf localhost:8000/ | grep -q '<div id="root">' && exit 0  # the UI is served
            fi
            sleep 2
          done
          docker logs api
          exit 1
