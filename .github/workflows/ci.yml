name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[agent,trace,dev]"
      - name: Lint
        run: ruff check src tests
      # The CC BY guideline corpus is not committed; one test checks the retrieval
      # labels against it.
      - name: Fetch guideline corpus
        run: python scripts/fetch_guidelines.py
      # No API key, dataset or weights here: the tests use small synthetic data and
      # fake clients. The evals that call Claude are run by hand (RESULTS.md).
      - name: Test
        run: pytest -q
