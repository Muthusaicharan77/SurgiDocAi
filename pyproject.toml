[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgidoc"
version = "0.1.0"
description = "Agentic documentation of laparoscopic cholecystectomy videos (research demo, not for clinical use)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2",
    "scipy>=1.11",
    "torch>=2.6",
    "torchvision>=0.21",
]

[project.optional-dependencies]
train = ["segmentation-models-pytorch>=0.3.4", "wandb>=0.17"]
download = ["gdown>=5"]
agent = ["anthropic>=0.70", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=3", "python-dotenv>=1",
         "sentence-transformers>=5", "qdrant-client>=1.12"]
trace = ["langfuse>=5,<6"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
